version: 2
sources:
  - name: ventas_raw
    schema: raw
    tables:
      - name: ventas
        # Actualidad de la carga: se mide con el instante en que llegó a raw (_loaded_at, UTC).
        # Hasta 12 h: pass | más de 12 h y hasta 24 h: warn | más de 24 h: error
        loaded_at_field: _loaded_at
        freshness:
          warn_after: {count: 12, period: hour}
          error_after: {count: 24, period: hour}
        columns:
          - name: id_venta
            tests: [unique, not_null]
          - name: fecha_venta
            tests: [not_null]
          - name: cantidad
            tests: [not_null]
          - name: precio_unitario
            tests: [not_null]
          - name: _loaded_at
            tests: [not_null]
